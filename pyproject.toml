[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.1.0"
description = "Implementation of Geospatial Exploration of Latent Embedding Space for Land Cover Dataset"
authors = [
  { name = "CGA" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true


[tool.pixi.workspace]
name = "gelos-lc"
description = "Implementation of Geospatial Exploration of Latent Embedding Space for Land Cover Dataset"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Most runtime Python deps come from gelos via [project.dependencies] in the
# gelos repo. Only gelos-lc-specific deps and dev-env tooling live here.
[tool.pixi.dependencies]
python = "~=3.11.0"
pytest = "*"
ruff = "*"
pip = "*"
jupyterlab = "*"
python-dotenv = "*"
mkdocs = "*"
python-pptx = ">=1.0.2,<2"
plotly = "*"
# terratorch 1.1.1 pins jsonargparse<=4.35, which rules out lightning>=2.5.2;
# the lightning that remains (2.5.1) requires packaging<25. Pin the conda
# packaging so the conda solve doesn't hand pypi an unusable packaging==26.
packaging = "<25"

# Python-level deps come through pip so pixi resolves the same package
# universe Docker does. torch/torchvision are pinned to match the
# pytorch/pytorch:2.7.1-cuda12.8 base image used by the Dockerfile (and
# olmoearth-pretrain's torch>=2.7,<2.8 bound) — bump as a pair when the
# Dockerfile base image moves.
[tool.pixi.pypi-dependencies]
awscli = "*"
boto3 = "*"
mkdocs = "*"
python-dotenv = "*"
torch = "==2.7.*"
torchvision = "==0.22.*"

[tool.pixi.pypi-dependencies.src]
path = "."
editable = true

# gelos is pinned to the same tag as the Dockerfile's GELOS_VERSION so the
# local env and the images resolve the same gelos (and its dependency tree,
# incl. olmoearth-pretrain, which unit tests need to import the OlmoEarth
# backbone). Bump both together. v0.9.0 adds the kNN geographic-distance metric and plots (gelos#85). v0.8.0 brought the Prithvi TL wrapper
# (gelos#78, `prithvi_eo_v2_*_tl_coords`, used by exp038/exp039) and per-config
# figure folders (gelos#89). `make dev-install` can still overlay an editable
# ../gelos checkout on top for gelos development.
[tool.pixi.pypi-dependencies.gelos]
git = "https://github.com/ClarkCGA/gelos.git"
tag = "v0.11.0"
extras = ["alphaearth"]

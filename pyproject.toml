[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.1.0"
description = "Implementation of Geospatial Exploration of Latent Embedding Space for Land Cover Dataset"
authors = [
  { name = "CGA" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true


[tool.pixi.workspace]
name = "gelos-lc"
description = "Implementation of Geospatial Exploration of Latent Embedding Space for Land Cover Dataset"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Most runtime Python deps come from gelos via [project.dependencies] in the
# gelos repo. Only gelos-lc-specific deps and dev-env tooling live here.
[tool.pixi.dependencies]
python = "~=3.11.0"
pytest = "*"
ruff = "*"
pip = "*"
jupyterlab = "*"
python-dotenv = "*"
mkdocs = "*"
python-pptx = ">=1.0.2,<2"
plotly = "*"

# Python-level deps come through pip so pixi resolves the same package
# universe Docker does. torch/torchvision are pinned to match the
# pytorch/pytorch:2.8.0-cuda12.9 base image used by the Dockerfile — bump as a
# pair when the Dockerfile base image moves.
[tool.pixi.pypi-dependencies]
awscli = "*"
boto3 = "*"
mkdocs = "*"
python-dotenv = "*"
torch = "==2.8.*"
torchvision = "==0.23.*"

[tool.pixi.pypi-dependencies.src]
path = "."
editable = true

# gelos is installed via `make dev-install` (editable from ../gelos) rather than
# pixi, so its WIP dependency tree doesn't have to flow through pixi's solver.
# Docker builds install gelos with `uv pip` for the same reason.

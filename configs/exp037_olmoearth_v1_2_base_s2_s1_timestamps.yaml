# Timestamp variant of exp031 (OlmoEarth V1.2 Base S2+S1), identical except for
# the dataset class, experiment name and title.
#
# Baseline exp031 never overrides the gelos dataset metadata hooks, so the
# OlmoEarth backbone falls back to the constant dummy date [15, 0, 2020]
# (day 15, January, 2020) for all four timesteps of every chip. This config
# selects GELOSLCMetadataDataSet, which threads each chip's real Sentinel-2
# acquisition dates (chip tracker `s2l2a_dates`) through the gelos#79
# `_get_timestamps` hook -> batch["timestamps"] (B, T, 3) -> backbone
# set_batch_timestamps, so the temporal encoding reflects true seasonality.
#
# S1 acquisition dates (`s1rtc_dates`) differ from the S2 dates by a few days,
# but OlmoEarth takes a single `timestamps` tensor shared by all modalities, so
# the S2 dates are used (S2 is the primary temporal sensor per the gelos hook
# docstring).
#
# OlmoEarth consumes only the MONTH of each timestamp (olmoearth_pretrain
# nn/flexi_vit.py, `months = timestamps[:, :, 1]`; day and year are unused), so
# differences vs exp031 isolate the effect of real-month vs all-January
# seasonality encoding. Location is not threaded: no gelos backbone consumes it.
#
# Bands, transforms, temporal_pooling: keep, spatial_pooling: 4, extraction
# strategies, metrics and models are byte-identical to exp031 so slices and
# artifact prefixes line up for the comparison configs (16_*, 17b_*).
experiment_name: "OlmoEarth V1.2 Base S2+S1 + Timestamps"
data_version: "v0.50.1"
chip_tracker: "gelos_chip_tracker.geojson"
chip_id_column: "id"

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  callbacks: []
  max_epochs: 0

data:
  class_path: gelos.gelosdatamodule.GELOSDataModule
  init_args:
    # Opt-in subclass that returns real S2 acquisition dates via _get_timestamps
    dataset_class: src.gelosdataset_lc.GELOSLCMetadataDataSet
    batch_size: 1
    num_workers: 0
    # The gelos OlmoEarth backbone applies OlmoEarth's exact pretraining
    # normalization internally (S1: dB conversion + mean±2σ min-max,
    # S2: mean±2σ min-max on raw DN), so the datamodule must pass raw values
    # straight through: no z-score normalization and no db_scale_bands here.
    normalize: false
    bands:
      S2L2A:
      - COASTAL_AEROSOL
      - BLUE
      - GREEN
      - RED
      - RED_EDGE_1
      - RED_EDGE_2
      - RED_EDGE_3
      - NIR_BROAD
      - NIR_NARROW
      - WATER_VAPOR
      - SWIR_1
      - SWIR_2
      S1RTC:
      - VV
      - VH
    transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.augmentations.geometric.resize.Resize
        init_args:
          height: 96
          width: 96
          interpolation: 0 # Nearest Neighbor
      - class_path: albumentations.pytorch.transforms.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 4

model:
  class_path: terratorch.tasks.EmbeddingGenerationTask
  title: OlmoEarth V1.2 Base S2+S1 + Timestamps
  init_args:
    model: olmoearth_v1_2_base_s1s2
    model_args:
      model_id: allenai/OlmoEarth-v1_2-Base
      pretrained: True
      patch_size: 4
      # keep: return per-timestep tokens (time-major) instead of the temporal
      # mean, so extraction strategies can slice 1 vs 4 timesteps (see below).
      temporal_pooling: keep
      # Average 4x4 token neighborhoods after encoding: the native 24x24 grid of
      # 4x4-pixel tokens becomes a 6x6 grid of 16x16-pixel tokens, matching the
      # patch footprint and token indices of Prithvi/TerraMind on 96x96 inputs.
      spatial_pooling: 4
      bands:
        - COASTAL_AEROSOL
        - BLUE
        - GREEN
        - RED
        - RED_EDGE_1
        - RED_EDGE_2
        - RED_EDGE_3
        - NIR_BROAD
        - NIR_NARROW
        - WATER_VAPOR
        - SWIR_1
        - SWIR_2
      # NOTE: the gelos OlmoEarth backbone applies OlmoEarth's exact pretraining
      # S1 transform internally (linear power -> dB, then mean±2σ min-max), so
      # it must receive RAW linear-power S1 from the datamodule: normalize is
      # false above and db_scale_bands must not be set in this config.
      bands_s1:
        - VV
        - VH
    output_format: parquet
    embed_file_key: filename
    layers: [-1]
    embedding_pooling: null
    has_cls: False
    temporal_cfg:
      # temporal_wrapper MUST be False: TemporalWrapper produces 4D input but
      # OlmoEarthBackbone.forward_features requires 5D (B, C, T, H, W) — OlmoEarth
      # consumes the time axis natively (joint space-time attention).
      # Temporal handling is instead controlled by model_args.temporal_pooling.
      temporal_wrapper: False
      temporal_pooling: keep

# With model_args temporal_pooling: keep + spatial_pooling: 4, OlmoEarthBackbone
# returns per-timestep tokens (S2 and S1 fused by equal-weight average per token)
# on a pooled 6x6 grid, flattened time-major: (B, T*36, D) = (B, 144, 768). Each
# token covers 16x16 pixels, so the grid and token indices match Prithvi/TerraMind
# on 96x96 inputs: token index = t*36 + row*6 + col, center patch = 2*6 + 2 = 14
# within each timestep block.
# Strategies below mirror exp013 (TerraMind S2+S1) for cross-model comparison.
# NOTE: a single timestep's tokens still come from one joint space-time attention
# pass over all 4 timesteps, so single- vs all-timestep strategies isolate the
# token count fed to metrics/models, not the model's access to temporal context
# (same caveat applies to the Prithvi/TerraMind configs).
embedding_extraction_strategies:
  # Center patch at each of the 4 timesteps: tokens 14, 50, 86, 122 -> 4*768
  # dims/chip. Tests whether multi-temporal tokens improve class separability.
  all_steps_of_middle_patch:
    title: "Temporal (Center Patch, All 4 Time Steps)"
    slice_args:
      - start: 14
        stop: null
        step: 36
    transforms:
      - type: tsne
      - type: umap
    metrics:
      - type: pca_ablation
        params:
          variance_thresholds: [0.8, 0.85, 0.9, 0.95, 0.99]
      - type: knn_purity
        params:
          k_values: [1, 2, 5, 10, 20, 50]
      - type: knn_geo_distance
        params:
          k_values: [1, 2, 5, 10, 20, 50]
    plots:
      - type: scatter_2d
        transform: tsne
        params:
          axis_lim: 160
      - type: scatter_2d
        transform: umap
        params:
          axis_lim: ~
      - type: temporal_cosine_similarity
        transform: raw
        params:
          n_timesteps: 4
          timestep_labels: ["Jan-Mar", "Apr-Jun", "Jul-Sep", "Oct-Dec"]
    models:
      - type: random_forest
        transform: raw
  # All 36 patches of a single timestep (t=1, Apr-Jun): tokens 36-71.
  # Central 4 patches of a single timestep (t=1, Apr-Jun): within-timestep
  # patches 13-16 -> tokens 49-52, mirroring exp013 -> 4*768 dims/chip, the
  # single-timestep counterpart to all_steps_of_middle_patch at equal dims.
  four_patches_from_april_to_june:
    title: "Spatial (4 Central Patches, Single Time Step — Apr–Jun)"
    slice_args:
      - start: 49
        stop: 53
        step: 1
    transforms:
      - type: tsne
      - type: umap
    metrics:
      - type: pca_ablation
        params:
          variance_thresholds: [0.8, 0.85, 0.9, 0.95, 0.99]
      - type: knn_purity
        params:
          k_values: [1, 2, 5, 10, 20, 50]
      - type: knn_geo_distance
        params:
          k_values: [1, 2, 5, 10, 20, 50]
    plots:
      - type: scatter_2d
        transform: tsne
        params:
          axis_lim: 160
      - type: scatter_2d
        transform: umap
        params:
          axis_lim: ~
    models:
      - type: random_forest
        transform: raw

style:
  category_column: "lulc"
  colors:
    "1": "#419bdf"    # Water
    "2": "#397d49"    # Trees
    "5": "#e49635"    # Crops
    "7": "#c4281b"    # Built Area
    "8": "#a59b8f"    # Bare Ground
    "11": "#e3e2c3"   # Rangeland
  labels:
    "1": "Water"
    "2": "Trees"
    "5": "Crops"
    "7": "Built Area"
    "8": "Bare Ground"
    "11": "Rangeland"

comparison_name: "Spatial kNN (GSD & Latitude Difference) — Story 6: Temporal Context — Terramind S2+S1 (Temporal vs Spatial)"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2+S1 | Temporal (4 steps)"
    color: "#c45a5a"
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "TM Base | S2+S1 | Spatial (1 step)"
    color: "#8b1a1a"
  - data_version: "v0.50.1"
    config: "exp019_spectral_bands_s2_s1_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2+S1 | Temporal (4 steps)"
    color: "#999999"
  - data_version: "v0.50.1"
    config: "exp020_spectral_bands_s2_s1_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Spectral Bands | S2+S1 | Spatial (1 step)"
    color: "#555555"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

comparison_name: "Spatial kNN (GSD & Latitude Difference) — Story 7: Terramind Scale × Sensor Inputs"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp011_terramind_v1_base_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2 (11-band) | Temporal (4 steps)"
    color: "#e09898"
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2+S1+DEM | Temporal (4 steps)"
    color: "#8b1a1a"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2 (11-band) | Temporal (4 steps)"
    color: "#ffb380"
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1+DEM | Temporal (4 steps)"
    color: "#c75a00"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

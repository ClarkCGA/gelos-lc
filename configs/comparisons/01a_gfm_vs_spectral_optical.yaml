comparison_name: "KNN Purity — Story 1a: Optical GFMs vs Spectral Bands (S2)"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Prithvi 300M | S2 (6-band) | Temporal (4 steps)"
    color: "#1f4e8c"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | S2 (6-band) | Temporal (4 steps)"
    color: "#00838f"
  - data_version: "v0.50.1"
    config: "exp015_spectral_bands_s2_prithvi_bands_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2 (6-band) | Temporal (4 steps)"
    color: "#cccccc"

comp_metrics:
  - type: knn_purity_comparison
  - type: knn_purity_per_query_comparison

comp_plots:
  - type: knn_purity_plot
    metric: knn_purity_comparison
    params:
      n_cols: 3
  - type: knn_purity_violin_distribution_plot
    metric: knn_purity_per_query_comparison

# Story 17b: embedding-space shift from real S2 acquisition dates, S2+S1.
# Control exp031 feeds OlmoEarth the constant dummy date [15, 0, 2020]; exp037
# threads the real S2 dates via GELOSLCMetadataDataSet (gelos#79; S1 dates
# differ by days but OlmoEarth takes one timestamps tensor for all modalities).
# Per-chip cosine similarity pairs each chip with itself in the control.
# x_range is deliberately omitted (autoscale): the month-embedding shift is
# expected to be far larger than the ±10% band-noise range used in comparison 14.
comparison_name: "OlmoEarth V1.2 Base S2+S1: Generic vs Real Acquisition Dates @ Temporal (4 steps)"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp031_olmoearth_v1_2_base_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "Control"
    color: "#42a5f5"
  - data_version: "v0.50.1"
    config: "exp037_olmoearth_v1_2_base_s2_s1_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "Real acquisition dates"
    color: "#1565c0"

comp_metrics:
  - type: per_chip_similarity_to_control
    params:
      control_label: "Control"
      chip_tracker_path: "/app/data/raw/v0.50.1/gelos_chip_tracker.geojson"
      chip_id_column: "id"
      category_column: "lulc"
  - type: cosine_distance

comp_plots:
  - type: per_class_similarity_distribution_plot
    metric: per_chip_similarity_to_control
    params:
      control_label: "Control"
      n_cols: 3
      bins: 30
  - type: per_class_ecdf_plot
    metric: per_chip_similarity_to_control
    params:
      control_label: "Control"
      n_cols: 3
  - type: distance_matrix
    metric: cosine_distance

comparison_name: "PCA Ablation Comparison (All Experiments)"

experiments:
  # --- Prithvi EO V2 300M ---
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "cls_token"
    layer: "layer_23"
    label: "Prithvi 300M | S2 (6-band) | CLS Token"
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Prithvi 300M | S2 (6-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Prithvi 300M | S2 (6-band) | Spatial (1 step)"

  # --- Prithvi EO V2 600M ---
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "cls_token"
    layer: "layer_31"
    label: "Prithvi 600M | S2 (6-band) | CLS Token"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | S2 (6-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_31"
    label: "Prithvi 600M | S2 (6-band) | Spatial (1 step)"

  # --- Terramind V1 Base ---
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2+S1+DEM | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "TM Base | S2+S1+DEM | Spatial (1 step)"

  # --- Terramind V1 Large ---
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1+DEM | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "TM Large | S2+S1+DEM | Spatial (1 step)"

  # --- AlphaEarth ---
  - data_version: "v0.50.1"
    config: "exp023_alphaearth_middle_patch"
    strategy: "middle_patch"
    layer: "middle_patch"
    label: "AlphaEarth | Annual (Center Patch)"

  # --- Sensor ablations ---
  - data_version: "v0.50.1"
    config: "exp011_terramind_v1_base_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2 (11-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp011_terramind_v1_base_s2_only"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "TM Base | S2 (11-band) | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2 (11-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "TM Large | S2 (11-band) | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "TM Base | S2+S1 | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "TM Base | S2+S1 | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1 | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "TM Large | S2+S1 | Spatial (1 step)"

  # --- Spectral Band Baselines ---
  - data_version: "v0.50.1"
    config: "exp015_spectral_bands_s2_prithvi_bands_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2 (6-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp016_spectral_bands_s2_prithvi_bands_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Spectral Bands | S2 (6-band) | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp017_spectral_bands_s2_full_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2 (12-band) | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp018_spectral_bands_s2_full_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Spectral Bands | S2 (12-band) | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp019_spectral_bands_s2_s1_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2+S1 | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp020_spectral_bands_s2_s1_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Spectral Bands | S2+S1 | Spatial (1 step)"
  - data_version: "v0.50.1"
    config: "exp021_spectral_bands_s2_s1_dem_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2+S1+DEM | Temporal (4 steps)"
  - data_version: "v0.50.1"
    config: "exp022_spectral_bands_s2_s1_dem_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Spectral Bands | S2+S1+DEM | Spatial (1 step)"

comp_metrics:
  - type: pca_ablation_comparison

comp_plots:
  - type: pca_ablation_table
    metric: pca_ablation_comparison

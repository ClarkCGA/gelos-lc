comparison_name: "Spatial kNN (GSD & Latitude Difference) — 1c: OlmoEarth v1.2 Base Family (S2 vs S2+S1) vs Spectral Bands"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp036_olmoearth_v1_2_base_s2_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2 (12-band) | Temporal (4 steps)"
    color: "#7cb342"
  - data_version: "v0.50.1"
    config: "exp037_olmoearth_v1_2_base_s2_s1_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2+S1 | Temporal (4 steps)"
    color: "#1565c0"
  - data_version: "v0.50.1"
    config: "exp017_spectral_bands_s2_full_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2 (12-band) | Temporal (4 steps)"
    color: "#cccccc"
  - data_version: "v0.50.1"
    config: "exp019_spectral_bands_s2_s1_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Spectral Bands | S2+S1 | Temporal (4 steps)"
    color: "#333333"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

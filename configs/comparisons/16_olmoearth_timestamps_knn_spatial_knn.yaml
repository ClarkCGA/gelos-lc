# Story 16: does feeding OlmoEarth v1.2 the real S2 acquisition dates (month
# embedding) instead of the constant dummy date [15, 0, 2020] (all timesteps =
# January) change class separability? Baselines exp030/exp031 use the generic
# date; exp036/exp037 thread real dates via GELOSLCMetadataDataSet (gelos#79).
# OlmoEarth uses only the month of each timestamp, so this isolates seasonality
# encoding. Pairs (baseline, variant) share a hue: green for S2, blue for S2+S1.
comparison_name: "Spatial kNN (GSD & Latitude Difference) — Story 16: OlmoEarth V1.2 Generic vs Real Acquisition Dates"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp030_olmoearth_v1_2_base_s2"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2 | Generic date"
    color: "#7cb342"
  - data_version: "v0.50.1"
    config: "exp036_olmoearth_v1_2_base_s2_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2 | Real dates"
    color: "#33691e"
  - data_version: "v0.50.1"
    config: "exp031_olmoearth_v1_2_base_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2+S1 | Generic date"
    color: "#42a5f5"
  - data_version: "v0.50.1"
    config: "exp037_olmoearth_v1_2_base_s2_s1_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2+S1 | Real dates"
    color: "#1565c0"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

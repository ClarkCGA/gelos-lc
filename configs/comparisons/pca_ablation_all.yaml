comparison_name: "PCA Ablation Comparison (All Experiments)"

experiments:
  # --- Prithvi EO V2 300M ---
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "cls_token"
    layer: "layer_23"
    label: "Prithvi 300M | CLS Token"
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Prithvi 300M | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Prithvi 300M | 4 Patches (Apr-Jun)"

  # --- Prithvi EO V2 600M ---
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "cls_token"
    layer: "layer_31"
    label: "Prithvi 600M | CLS Token"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_31"
    label: "Prithvi 600M | 4 Patches (Apr-Jun)"

  # --- Terramind V1 Base ---
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "Terramind Base | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "Terramind Base | 4 Patches (Apr-Jun)"

  # --- Terramind V1 Large ---
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Terramind Large | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Terramind Large | 4 Patches (Apr-Jun)"

  # --- Sensor ablations ---
  - data_version: "v0.50.1"
    config: "exp011_terramind_v1_base_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "Terramind Base S2 Only | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp011_terramind_v1_base_s2_only"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "Terramind Base S2 Only | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Terramind Large S2 Only | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Terramind Large S2 Only | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_11"
    label: "Terramind Base S2+S1 | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp013_terramind_v1_base_s2_s1"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "Terramind Base S2+S1 | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Terramind Large S2+S1 | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Terramind Large S2+S1 | 4 Patches (Apr-Jun)"

  # --- Raw Pixel Baselines ---
  - data_version: "v0.50.1"
    config: "exp015_raw_pixels_s2_prithvi_bands_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels (S2 Prithvi Bands) | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp016_raw_pixels_s2_prithvi_bands_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Raw Pixels (S2 Prithvi Bands) | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp017_raw_pixels_s2_full_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels (S2 12-band) | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp018_raw_pixels_s2_full_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Raw Pixels (S2 12-band) | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp019_raw_pixels_s2_s1_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels (S2+S1) | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp020_raw_pixels_s2_s1_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Raw Pixels (S2+S1) | 4 Patches (Apr-Jun)"
  - data_version: "v0.50.1"
    config: "exp021_raw_pixels_s2_s1_dem_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels (S2+S1+DEM) | Middle Patch (4 steps)"
  - data_version: "v0.50.1"
    config: "exp022_raw_pixels_s2_s1_dem_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"
    label: "Raw Pixels (S2+S1+DEM) | 4 Patches (Apr-Jun)"

comp_metrics:
  - type: pca_ablation_comparison

comp_plots:
  - type: pca_ablation_table
    metric: pca_ablation_comparison

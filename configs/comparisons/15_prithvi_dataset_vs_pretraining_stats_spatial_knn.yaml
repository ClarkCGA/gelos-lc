comparison_name: "Spatial kNN (GSD & Latitude Difference) — Prithvi Normalization: Dataset vs Pretraining Stats"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp001_prithvi300"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Prithvi 300M | Pretraining Stats | Temporal (4 steps)"
    color: "#1f4e8c"
  - data_version: "v0.50.1"
    config: "exp032_prithvi300_dataset_stats"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "Prithvi 300M | Dataset Stats | Temporal (4 steps)"
    color: "#7da7d9"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | Pretraining Stats | Temporal (4 steps)"
    color: "#00838f"
  - data_version: "v0.50.1"
    config: "exp033_prithvi600_dataset_stats"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | Dataset Stats | Temporal (4 steps)"
    color: "#7fd4dc"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

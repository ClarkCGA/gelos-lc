# Each family is represented by its largest model on its fullest input set:
# Prithvi 600M (S2 6-band, no TL), OlmoEarth v1.2 Base (S2+S1),
# Terramind V1 Large (S2+S1), AlphaEarth (annual embedding).
comparison_name: "Spatial kNN (GSD & Latitude Difference) — 2: Across Families (Prithvi 600M, OlmoEarth v1.2 Base, Terramind Large, AlphaEarth)"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_31"
    label: "Prithvi 600M | S2 (6-band) | Temporal (4 steps)"
    color: "#00838f"
  - data_version: "v0.50.1"
    config: "exp037_olmoearth_v1_2_base_s2_s1_timestamps"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_0"
    label: "OlmoEarth v1.2 Base | S2+S1 | Temporal (4 steps)"
    color: "#1565c0"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1 | Temporal (4 steps)"
    color: "#e57e2e"
  - data_version: "v0.50.1"
    config: "exp023_alphaearth_middle_patch"
    strategy: "middle_patch"
    layer: "middle_patch"
    label: "AlphaEarth | Annual (Center Patch)"
    color: "#6a3d9a"

comp_metrics:
  - type: knn_geo_distance_comparison

comp_plots:
  - type: knn_gsd_plot
    metric: knn_geo_distance_comparison
  - type: knn_lat_diff_plot
    metric: knn_geo_distance_comparison

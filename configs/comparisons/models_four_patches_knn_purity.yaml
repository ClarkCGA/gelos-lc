    config: "exp001_prithvi300"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Prithvi 300M"
  - data_version: "v0.50.1"
    config: "exp004_prithvi600"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_31"
    label: "Prithvi 600M"
  - data_version: "v0.50.1"
    config: "exp007_terramind_v1_base"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_11"
    label: "Terramind Base"
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "four_patches_from_april_to_june"
    layer: "layer_23"
    label: "Terramind Large"
  - data_version: "v0.50.1"
    config: "exp016_raw_pixels_s2_prithvi_bands_four_patches"
    strategy: "four_patches_from_april_to_june"
    layer: "four_patches_from_april_to_june"

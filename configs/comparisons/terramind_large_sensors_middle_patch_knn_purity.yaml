comparison_name: "KNN Purity — Terramind Large Sensor Ablation @ Temporal (4 steps)"

class_labels:
  "1": "Water"
  "2": "Trees"
  "5": "Crops"
  "7": "Built Area"
  "8": "Bare Ground"
  "11": "Rangeland"

experiments:
  - data_version: "v0.50.1"
    config: "exp010_terramind_v1_large"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1+DEM | Temporal (4 steps)"
    color: "#c75a00"
  - data_version: "v0.50.1"
    config: "exp012_terramind_v1_large_s2_only"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2 (11-band) | Temporal (4 steps)"
    color: "#ffb380"
  - data_version: "v0.50.1"
    config: "exp014_terramind_v1_large_s2_s1"
    strategy: "all_steps_of_middle_patch"
    layer: "layer_23"
    label: "TM Large | S2+S1 | Temporal (4 steps)"
    color: "#e57e2e"
  - data_version: "v0.50.1"
    config: "exp017_raw_pixels_s2_full_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels | S2 (12-band) | Temporal (4 steps)"
    color: "#999999"
  - data_version: "v0.50.1"
    config: "exp019_raw_pixels_s2_s1_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels | S2+S1 | Temporal (4 steps)"
    color: "#666666"
  - data_version: "v0.50.1"
    config: "exp021_raw_pixels_s2_s1_dem_middle_patch"
    strategy: "all_steps_of_middle_patch"
    layer: "all_steps_of_middle_patch"
    label: "Raw Pixels | S2+S1+DEM | Temporal (4 steps)"
    color: "#333333"

comp_metrics:
  - type: knn_purity_comparison
  - type: knn_purity_per_query_comparison

comp_plots:
  - type: knn_purity_plot
    metric: knn_purity_comparison
    params:
      n_cols: 3
  - type: knn_purity_violin_distribution_plot
    metric: knn_purity_per_query_comparison
